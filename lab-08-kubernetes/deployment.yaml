apiVersion: apps/v1
kind: Deployment
metadata:
  name: igor-flask-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: igor-flask
  template:
    metadata:
      labels:
        app: igor-flask
    spec:
      containers:
        - name: igor-flask-app
          image: igor-flask-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: igor-flask-service
spec:
  type: NodePort
  selector:
    app: igor-flask
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080